plugins {
    id 'com.android.application'
}

android {
    namespace 'net.coworklab.claudevoz'
    compileSdk 34

    defaultConfig {
        applicationId 'net.coworklab.claudevoz'
        minSdk 26
        targetSdk 34
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer)
        versionName "1.0.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
    }

    signingConfigs {
        propria {
            storeFile file(System.getenv('KEYSTORE_FILE') ?: 'assinatura.jks')
            storePassword 'claudevoz'
            keyAlias 'claudevoz'
            keyPassword 'claudevoz'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.propria
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.propria
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
